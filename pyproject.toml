[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "modelbuilder-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch==2.12.0",
  "torchvision==0.27.0",
  "numpy>=1.26,<2.0",
  "Pillow>=10,<15",
  "kagglehub>=1,<2",
  "datasets>=4.0,<5",
  "huggingface-hub>=1.31,<2",
  "transformers==5.22.2",
  "sentence-transformers==6.2.0",
  "safetensors>=0.8,<1",
  "accelerate>=1.10,<2",
  "peft>=0.17,<1",
  "pyarrow>=20,<22",
  "ultralytics>=8.4,<8.5",
  "opencv-python==4.11.0.86",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["modelbuilder*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
