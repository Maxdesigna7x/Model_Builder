[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "modelbuilder-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "numpy",
  "Pillow",
  "datasets>=4.0,<5",
  "huggingface-hub>=0.36,<2",
  "pyarrow>=20,<22",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["modelbuilder*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
