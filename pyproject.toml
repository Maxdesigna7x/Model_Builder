[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "modelbuilder-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "numpy",
  "Pillow",
  "kagglehub>=1,<2",
  "datasets>=4.0,<5",
  "huggingface-hub>=1.5,<2",
  "transformers>=5.10,<6",
  "safetensors>=0.6,<1",
  "accelerate>=1.10,<2",
  "peft>=0.17,<1",
  "pyarrow>=20,<22",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["modelbuilder*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
