name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Stage runtime manager
        run: |
          python -m pip install uv==0.9.30
          python scripts/prepare-desktop-runtime.py
      - name: Verify clean CPU runtime
        run: python scripts/test-desktop-runtime.py
      - name: Set installer version
        run: node scripts/set-desktop-build-version.mjs
      - name: Build desktop installers
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: ModelBuilder-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows and Linux installers
        uses: actions/download-artifact@v4
        with:
          pattern: ModelBuilder-*
          path: installers
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="desktop-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          mapfile -d '' files < <(find installers -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) -print0)
          [[ ${#files[@]} -eq 4 ]] || { echo "Se esperaban cuatro instaladores; encontrados: ${#files[@]}" >&2; exit 1; }
          cat > release-notes.md <<'NOTES'
          Instaladores para Windows x64 y Linux x86_64, generados automáticamente desde el commit indicado en esta versión.

          Durante el primer inicio, ModelBuilder permite elegir CPU o GPU NVIDIA y descarga las dependencias en un entorno privado. Se necesita conexión a Internet y varios GB de espacio libre. NVIDIA requiere una GPU y un controlador compatibles con CUDA 13.0.

          En Linux se puede iniciar con `--graphics=compatible` para probar un renderizado conservador y con `--diagnose` para ver información básica. Esta mejora no confirma la solución de todos los casos de ventana en blanco; la auditoría de dependencias y la comprobación en el equipo afectado siguen pendientes.

          Los instaladores no están firmados. Las pruebas automáticas comprueban el entorno de CPU; la compatibilidad de NVIDIA depende del equipo y sus controladores.
          NOTES
          gh release create "$tag" --target "$SOURCE_SHA" --draft --title "ModelBuilder escritorio · compilación ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md "${files[@]}"
          gh release edit "$tag" --draft=false --latest
